# Release workflow — publishes rcomp-core then rcomp to crates.io.
#
# NOTE: This repo had no remote when this file was written; the first real
# run happens once the remote is created and a GitHub release is published.
#
# Trigger: pushing a version tag (e.g. v0.1.0).
# Steps:
#   1. Guard: tag must match [workspace.package].version in Cargo.toml.
#   2. Sanity: cargo publish --dry-run for rcomp-core (full verify is safe).
#      NO dry-run step for rcomp — it cannot be packaged until rcomp-core is
#      live on the index (cargo strips the path dep and must resolve from
#      crates.io; even --offline fails). This is documented in RELEASING.md.
#   3. Publish rcomp-core (cargo >=1.66 blocks until the crate is in the index).
#   4. Publish rcomp --no-verify with a retry loop for index propagation lag.
#
# Idempotency: if a previous run published rcomp-core but failed before rcomp,
# re-running the release is safe.  The "already published" check queries the
# crates.io sparse index (https://index.crates.io/<path>) before each publish
# and skips the step if the exact version is already there and not yanked.
# This lets a half-failed release be retried without manual intervention.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      # release_id is consumed by the desktop job to attach bundles to the
      # correct GitHub Release (rather than letting tauri-action create a new one).
      release_id: ${{ steps.create_release.outputs.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG notes
        id: changelog
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.release-notes }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ── Step 1: tag/version guard ──────────────────────────────────────────
      # Extract the workspace version with cargo metadata + jq (jq is
      # pre-installed on GitHub-hosted runners).  Strip the leading "v" from
      # the release tag and compare.  Fail loudly before anything is published.
      - name: Verify tag matches workspace version
        # Use env: to inject the tag — never interpolate github context
        # expressions directly into run: commands (injection risk).
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Strip leading "v" (v0.1.0 → 0.1.0)
          TAG_VERSION="${TAG#v}"

          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "rcomp") | .version')

          echo "Release tag version : ${TAG_VERSION}"
          echo "Cargo workspace version: ${CARGO_VERSION}"

          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::Tag '${TAG}' does not match workspace version '${CARGO_VERSION}'."
            echo "::error::Bump [workspace.package].version in Cargo.toml and re-publish the release."
            exit 1
          fi

          # Export for use in later steps via GITHUB_ENV
          echo "RELEASE_VERSION=${CARGO_VERSION}" >> "$GITHUB_ENV"

      # ── Step 2: sanity-publish rcomp-core (dry-run) ────────────────────────
      # Full --dry-run + verify works for rcomp-core because it has no
      # unpublished path dependencies.
      - name: Dry-run publish rcomp-core
        run: cargo publish -p rcomp-core --dry-run --locked

      # ── Step 3: publish rcomp-core ─────────────────────────────────────────
      # Idempotency: check the sparse index first.  If this exact version is
      # already present (and not yanked) we skip the publish so a re-run after
      # a partial failure doesn't error out with "already uploaded".
      #
      # Sparse index path layout (cargo reference):
      #   1-char name  : 1/<name>
      #   2-char name  : 2/<name>
      #   3-char name  : 3/<first-char>/<name>
      #   4+-char name : <first-2-chars>/<next-2-chars>/<name>
      # "rcomp-core" (10 chars) → rc/om/rcomp-core
      - name: Publish rcomp-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          CRATE="rcomp-core"
          VERSION="${RELEASE_VERSION}"
          INDEX_URL="https://index.crates.io/rc/om/${CRATE}"

          # Query the sparse index; HTTP 404 means never published; HTTP 200
          # returns NDJSON lines, one per version.
          HTTP_CODE=$(curl -s -o /tmp/index_response.json -w "%{http_code}" "${INDEX_URL}")

          ALREADY_PUBLISHED=false
          if [ "${HTTP_CODE}" = "200" ]; then
            # Look for a non-yanked entry with our exact version
            if grep -q "\"vers\":\"${VERSION}\"" /tmp/index_response.json; then
              YANKED=$(grep "\"vers\":\"${VERSION}\"" /tmp/index_response.json \
                | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(d.get('yanked', False))")
              if [ "${YANKED}" != "True" ]; then
                echo "rcomp-core ${VERSION} is already published and not yanked — skipping."
                ALREADY_PUBLISHED=true
              fi
            fi
          fi

          if [ "${ALREADY_PUBLISHED}" = "false" ]; then
            echo "Publishing rcomp-core ${VERSION}…"
            # cargo >=1.66 blocks here until the crate is visible in the index,
            # so step 4 can safely depend on rcomp-core being resolvable.
            cargo publish -p rcomp-core --locked
          fi

      # ── Step 4: publish rcomp ──────────────────────────────────────────────
      # --no-verify because rcomp cannot be packaged/verified locally until
      # rcomp-core is live on the index (see note at top of file).
      #
      # Retry loop (3 attempts, 30 s apart) as belt-and-braces against any
      # residual index-propagation lag despite cargo's blocking wait above.
      #
      # Idempotency: same sparse-index check as for rcomp-core.
      # "rcomp" (5 chars) → rc/om/rcomp
      - name: Publish rcomp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          CRATE="rcomp"
          VERSION="${RELEASE_VERSION}"
          INDEX_URL="https://index.crates.io/rc/om/${CRATE}"

          HTTP_CODE=$(curl -s -o /tmp/index_response_rcomp.json -w "%{http_code}" "${INDEX_URL}")

          ALREADY_PUBLISHED=false
          if [ "${HTTP_CODE}" = "200" ]; then
            if grep -q "\"vers\":\"${VERSION}\"" /tmp/index_response_rcomp.json; then
              YANKED=$(grep "\"vers\":\"${VERSION}\"" /tmp/index_response_rcomp.json \
                | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(d.get('yanked', False))")
              if [ "${YANKED}" != "True" ]; then
                echo "rcomp ${VERSION} is already published and not yanked — skipping."
                ALREADY_PUBLISHED=true
              fi
            fi
          fi

          if [ "${ALREADY_PUBLISHED}" = "false" ]; then
            echo "Publishing rcomp ${VERSION}…"
            # Retry up to 3 times with 30 s delays to handle index propagation lag.
            for attempt in 1 2 3; do
              echo "Attempt ${attempt}/3…"
              if cargo publish -p rcomp --no-verify --locked; then
                echo "rcomp ${VERSION} published successfully."
                break
              fi
              if [ "${attempt}" -lt 3 ]; then
                echo "Publish failed; retrying in 30 s…"
                sleep 30
              else
                echo "::error::All 3 publish attempts for rcomp failed."
                exit 1
              fi
            done
          fi

  # ── Desktop bundles ──────────────────────────────────────────────────────────
  # Builds the Tauri app for all three platforms and attaches the installers
  # to the GitHub Release created by the `release` job above.
  # `needs: release` guarantees the Release (and its id) exist before we upload.
  desktop:
    name: Desktop bundles (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # a failure on one OS must not delete assets from the others
      matrix:
        include:
          # Universal binary for macOS — one DMG for Intel + Apple Silicon.
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-latest
            args: ""
          - os: windows-latest
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Required only on Linux — macOS and Windows runners ship all Tauri deps.
      # Package list is kept in sync with ci.yml's bundle/desktop job.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            libxdo-dev \
            libssl-dev

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The universal-apple-darwin target is a synthetic target that requires
      # both native Apple Silicon and Intel toolchains to be registered.
      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: apps/rcomp-desktop
        run: bun install

      # tauri-action runs `beforeBuildCommand` (bun run build) itself, then
      # invokes `tauri build`, picks the correct per-OS artifacts, and uploads
      # them to the GitHub Release identified by `releaseId`.
      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/rcomp-desktop
          releaseId: ${{ needs.release.outputs.release_id }}
          args: ${{ matrix.args }}
