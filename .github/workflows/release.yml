# Release workflow — publishes rcomp-core, the GPU provider crates, then rcomp
# to crates.io.
#
# Trigger: pushing a version tag (e.g. v0.1.0).
# Steps:
#   1. Guard: tag must match [workspace.package].version in Cargo.toml.
#   2. Sanity: `cargo package` all four crates together.  Cargo packages them
#      into a temporary local registry, so every crate — including rcomp, whose
#      dependencies are not on crates.io yet — is packaged and build-verified
#      before anything is published.
#   3. Publish in dependency order: rcomp-core, rcomp-wgpu, rcomp-metal, rcomp
#      (cargo >=1.66 blocks until each crate is in the index; a short retry
#      loop covers residual propagation lag).
#
# Idempotency: if a previous run published some crates but failed before the
# rest, re-running the release is safe.  Before each publish the crates.io
# sparse index (https://index.crates.io/<path>) is queried and the crate is
# skipped if the exact version is already there and not yanked.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      # release_id is consumed by the desktop job to attach bundles to the
      # correct GitHub Release (rather than letting tauri-action create a new one).
      release_id: ${{ steps.create_release.outputs.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG notes
        id: changelog
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Appends a fixed legend below the changelog notes so every release
          # explains, once and for all, what its assets are: the desktop job
          # names its uploads `rcomp-desktop_<version>_<platform>-<arch>.<ext>`,
          # and the CLI is intentionally not a binary asset here (crates.io).
          body: |
            ${{ steps.changelog.outputs.release-notes }}

            ---

            ### About the assets below

            - `rcomp-desktop_*` files are the **Rcomp desktop app** (GUI) —
              pick the one matching your platform/architecture, e.g.
              `rcomp-desktop_${{ steps.version.outputs.version }}_macos-universal.dmg`.
            - The **`rcomp` command-line tool** is lowercase and is not shipped
              as a binary here — install it with `cargo install rcomp`.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ── Step 1: tag/version guard ──────────────────────────────────────────
      # Extract the workspace version with cargo metadata + jq (jq is
      # pre-installed on GitHub-hosted runners).  Strip the leading "v" from
      # the release tag and compare.  Fail loudly before anything is published.
      - name: Verify tag matches workspace version
        # Use env: to inject the tag — never interpolate github context
        # expressions directly into run: commands (injection risk).
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Strip leading "v" (v0.1.0 → 0.1.0)
          TAG_VERSION="${TAG#v}"

          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "rcomp") | .version')

          echo "Release tag version : ${TAG_VERSION}"
          echo "Cargo workspace version: ${CARGO_VERSION}"

          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::Tag '${TAG}' does not match workspace version '${CARGO_VERSION}'."
            echo "::error::Bump [workspace.package].version in Cargo.toml and re-publish the release."
            exit 1
          fi

          # Export for use in later steps via GITHUB_ENV
          echo "RELEASE_VERSION=${CARGO_VERSION}" >> "$GITHUB_ENV"

      # ── Step 2: package-verify every published crate ───────────────────────
      # Packaging the crates together resolves their inter-dependencies from a
      # temporary local registry, so this catches manifest problems in any
      # crate (e.g. a dependency crates.io would reject) before publishing.
      - name: Package and verify all crates
        run: cargo package -p rcomp-core -p rcomp-wgpu -p rcomp-metal -p rcomp --locked

      # ── Step 3: publish in dependency order ────────────────────────────────
      # Sparse index path layout (cargo reference), all our names are 4+ chars:
      #   <first-2-chars>/<next-2-chars>/<name>   e.g. rc/om/rcomp-core
      #
      # --no-verify: step 2 already built every package; rebuilding here would
      # only repeat that work.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish_crate() {
            CRATE="$1"
            VERSION="${RELEASE_VERSION}"
            INDEX_URL="https://index.crates.io/${CRATE:0:2}/${CRATE:2:2}/${CRATE}"

            # HTTP 404 means never published; HTTP 200 returns NDJSON lines,
            # one per version.
            HTTP_CODE=$(curl -s -o /tmp/index_response.json -w "%{http_code}" "${INDEX_URL}")

            if [ "${HTTP_CODE}" = "200" ] \
              && grep -q "\"vers\":\"${VERSION}\"" /tmp/index_response.json; then
              YANKED=$(grep "\"vers\":\"${VERSION}\"" /tmp/index_response.json \
                | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(d.get('yanked', False))")
              if [ "${YANKED}" != "True" ]; then
                echo "${CRATE} ${VERSION} is already published and not yanked — skipping."
                return 0
              fi
            fi

            echo "Publishing ${CRATE} ${VERSION}…"
            # Retry up to 3 times with 30 s delays to handle index propagation
            # lag for dependencies published moments earlier.
            for attempt in 1 2 3; do
              echo "Attempt ${attempt}/3…"
              if cargo publish -p "${CRATE}" --no-verify --locked; then
                echo "${CRATE} ${VERSION} published successfully."
                return 0
              fi
              if [ "${attempt}" -lt 3 ]; then
                echo "Publish failed; retrying in 30 s…"
                sleep 30
              fi
            done
            echo "::error::All 3 publish attempts for ${CRATE} failed."
            return 1
          }

          set -e
          for crate in rcomp-core rcomp-wgpu rcomp-metal rcomp; do
            publish_crate "${crate}"
          done

  # ── Desktop bundles ──────────────────────────────────────────────────────────
  # Builds the Tauri app for all three platforms and attaches the installers
  # to the GitHub Release created by the `release` job above.
  # `needs: release` guarantees the Release (and its id) exist before we upload.
  desktop:
    name: Desktop bundles (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # a failure on one OS must not delete assets from the others
      matrix:
        include:
          # Universal binary for macOS — one DMG for Intel + Apple Silicon.
          # `platform`/`arch` feed the asset-renaming step below, so every
          # uploaded file self-describes its OS, CPU architecture, and that
          # it's the desktop app (as opposed to the `rcomp` CLI, which is only
          # published to crates.io — see the release body legend).
          - os: macos-latest
            args: "--target universal-apple-darwin"
            platform: macos
            arch: universal
          - os: ubuntu-latest
            args: ""
            platform: linux
            arch: x86_64
          - os: windows-latest
            args: ""
            platform: windows
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Required only on Linux — macOS and Windows runners ship all Tauri deps.
      # Package list is kept in sync with ci.yml's bundle/desktop job.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            libxdo-dev \
            libssl-dev

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The universal-apple-darwin target is a synthetic target that requires
      # both native Apple Silicon and Intel toolchains to be registered.
      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: apps/rcomp-desktop
        run: bun install

      # Never publish an unsigned macOS release by accident. GitHub does not
      # expose whether a secret exists except through the value injected into a
      # job, so validate all required signing/notarization inputs before Tauri
      # starts the expensive universal build.
      - name: Verify macOS signing and notarization secrets
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for secret_name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [ -z "${!secret_name}" ]; then
              missing+=("${secret_name}")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      # tauri-action runs `beforeBuildCommand` (bun run build) itself, then
      # invokes `tauri build`, picks the correct per-OS artifacts, and uploads
      # them to the GitHub Release identified by `releaseId`.
      # APPLE_CERTIFICATE is a base64-encoded Developer ID Application .p12;
      # Tauri imports it and infers the signing identity. The Apple ID,
      # app-specific password, and team ID are used to notarize and staple the
      # macOS app before upload.
      - name: Build, sign, notarize, and upload macOS bundles
        if: matrix.os == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/rcomp-desktop
          releaseId: ${{ needs.release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Verify macOS bundle signature and Gatekeeper acceptance
        if: matrix.os == 'macos-latest'
        run: |
          APP_PATH=$(find target/universal-apple-darwin/release/bundle/macos \
            -maxdepth 1 -type d -name '*.app' -print -quit)

          if [ -z "${APP_PATH}" ]; then
            echo "::error::Tauri did not produce a macOS app bundle."
            exit 1
          fi

          bash .github/scripts/verify-macos-dependencies.sh "${APP_PATH}"
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          spctl --assess --type execute --verbose=4 "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"

      - name: Build and upload non-macOS bundles
        if: matrix.os != 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/rcomp-desktop
          releaseId: ${{ needs.release.outputs.release_id }}
          args: ${{ matrix.args }}

      # tauri-action names uploads after `productName` alone (e.g.
      # `Rcomp_0.3.2_amd64.deb`), with no indication it's the GUI app rather
      # than the `rcomp` CLI, nor which CPU architecture it targets. Rename
      # each asset in place via the API (no re-upload of the binary) to
      # `rcomp-desktop_<version>_<platform>-<arch>.<ext>` once uploaded.
      - name: Rename release assets for clarity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.release.outputs.version }}"
          TAG="${{ github.ref_name }}"
          PLATFORM="${{ matrix.platform }}"
          ARCH="${{ matrix.arch }}"

          rename_asset() {
            local suffix="$1" new_name="$2" id
            id=$(gh api "repos/{owner}/{repo}/releases/tags/${TAG}" \
              --jq ".assets[] | select(.name | endswith(\"${suffix}\")) | .id" | head -n1)
            if [ -n "${id}" ]; then
              echo "Renaming asset ${id} -> ${new_name}"
              gh api -X PATCH "repos/{owner}/{repo}/releases/assets/${id}" -f "name=${new_name}"
            else
              echo "No uploaded asset ending in ${suffix} found — skipping."
            fi
          }

          case "${PLATFORM}" in
            linux)
              rename_asset ".deb" "rcomp-desktop_${VERSION}_${PLATFORM}-${ARCH}.deb"
              rename_asset ".AppImage" "rcomp-desktop_${VERSION}_${PLATFORM}-${ARCH}.AppImage"
              ;;
            macos)
              rename_asset ".dmg" "rcomp-desktop_${VERSION}_${PLATFORM}-${ARCH}.dmg"
              ;;
            windows)
              rename_asset ".msi" "rcomp-desktop_${VERSION}_${PLATFORM}-${ARCH}.msi"
              rename_asset "-setup.exe" "rcomp-desktop_${VERSION}_${PLATFORM}-${ARCH}-setup.exe"
              ;;
          esac
