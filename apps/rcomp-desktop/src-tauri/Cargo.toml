[package]
name = "rcomp-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rcomp desktop application"

[lib]
name = "rcomp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcomp-core = { path = "../../../crates/rcomp-core", default-features = false, features = ["serde"] }

# Desktop-only: forward a second launch's argv (the "Open with" file path on
# Windows/Linux) to the already-running instance instead of opening a new window.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

[features]
default = ["rar"]
rar = ["rcomp-core/rar"]

[dev-dependencies]
tempfile = { workspace = true }
