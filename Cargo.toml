[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Unified compression/archive library and CLI"

[workspace.dependencies]
thiserror = "2"
tempfile = "3"
flate2 = "1.1.9"
bzip2 = "0.6.1"
liblzma = { version = "0.4.6", features = ["parallel"] }
zstd = { version = "0.13.3", features = ["zstdmt"] }
lz4 = "1.28.1"
brotli = "8.0.3"
